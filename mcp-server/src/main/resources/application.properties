spring.application.name=mcp-server
spring.ai.mcp.server.name=devlog-mcp
spring.ai.mcp.server.version=0.1.0
spring.ai.mcp.server.type=SYNC
spring.ai.mcp.server.stdio=true
spring.main.banner-mode=off
devlog.backend.base-url=${DEVLOG_BACKEND_BASE_URL:http://localhost:18080}
# Must match Core's SCA_CALLBACK_SECRET; blank intentionally fails closed.
devlog.story-agent.poll.timeout-ms=${DEVLOG_STORY_AGENT_POLL_TIMEOUT_MS:90000}
devlog.story-agent.poll.interval-ms=${DEVLOG_STORY_AGENT_POLL_INTERVAL_MS:2000}
devlog.security.oidc.issuer-uri=${KEYCLOAK_ISSUER_URI:}
devlog.security.oidc.audience=${KEYCLOAK_AUDIENCE:}
devlog.security.oidc.jwks-uri=${KEYCLOAK_JWKS_URI:}
devlog.security.oidc.bearer-token=${DEVLOG_MCP_BEARER_TOKEN:}
devlog.security.mcp.actor-client-id=${KEYCLOAK_MCP_ACTOR_CLIENT_ID:}
devlog.security.mcp.delegation-token=${DEVLOG_MCP_DELEGATION_TOKEN:}
