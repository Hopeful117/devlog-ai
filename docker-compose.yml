services:

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: devlog-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_started
    ports:
      - "${FRONTEND_PORT:-18083}:8080"
    healthcheck:
      test:
        - CMD
        - wget
        - --no-verbose
        - --tries=1
        - --spider
        - http://127.0.0.1:8080/health
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: devlog-backend
    restart: unless-stopped
    depends_on:
      ai-engine:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      postgres:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-devlog_ai}
      DB_USERNAME: ${POSTGRES_USER:-devlog}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-devlog}

      AI_ENGINE_BASE_URL: http://ai-engine:8000
      AI_ENGINE_PUBLIC_BASE_URL: ${AI_ENGINE_PUBLIC_BASE_URL:-http://127.0.0.1:18081}
      AI_ENGINE_CONNECT_TIMEOUT: ${AI_ENGINE_CONNECT_TIMEOUT:-2s}
      AI_ENGINE_READ_TIMEOUT: ${AI_ENGINE_READ_TIMEOUT:-100s}
      DEVLOG_SERVICE_AUTH_SECRET: ${DEVLOG_SERVICE_AUTH_SECRET:-}
      DEVICE_BASE_URL: ${DEVICE_BASE_URL:-http://127.0.0.1:65535}
      KEYCLOAK_ISSUER_URI: ${KEYCLOAK_ISSUER_URI:-http://host.docker.internal:18084/realms/devlog}
      KEYCLOAK_AUDIENCE: ${KEYCLOAK_AUDIENCE:-devlog-core}
      KEYCLOAK_MCP_ACTOR_CLIENT_ID: ${KEYCLOAK_MCP_ACTOR_CLIENT_ID:-devlog-mcp-opencode}
      KEYCLOAK_MCP_AGENT_PRINCIPAL_ID: ${KEYCLOAK_MCP_AGENT_PRINCIPAL_ID:-}
      KEYCLOAK_MCP_AGENT_PROJECTS: ${KEYCLOAK_MCP_AGENT_PROJECTS:-devlog-ai}
      DEVLOG_MCP_DELEGATION_AUDIENCE: ${DEVLOG_MCP_DELEGATION_AUDIENCE:-devlog-mcp}

      SERVER_PORT: 8080

      COLLECTION_WORKSPACE_ROOT: /var/lib/devlog-ai/workspaces

      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-default}

      LOG_LEVEL_ROOT: ${BACKEND_LOG_LEVEL_ROOT:-INFO}
      LOG_LEVEL_APP: ${BACKEND_LOG_LEVEL_APP:-INFO}
      DEVLOG_AI_TRACE_LEVEL: ${DEVLOG_AI_TRACE_LEVEL:-NORMAL}
      DEVLOG_AI_TRACE_DIAGNOSTIC_RETENTION: ${DEVLOG_AI_TRACE_DIAGNOSTIC_RETENTION:-7d}

    ports:
      - "${BACKEND_PORT:-18080}:8080"

    volumes:
      - devlog-workspaces:/var/lib/devlog-ai/workspaces

  ai-engine:
    build:
      context: ./ai-engine
      dockerfile: Dockerfile
    container_name: devlog-ai-engine
    restart: unless-stopped
    user: root
    command: ["/bin/sh", "-c", "chown -R devlog:devlog /data && exec su devlog -s /bin/sh -c 'uvicorn app.main:app --host 0.0.0.0 --port 8000'"]

    environment:
      LLM_PROVIDER: ${LLM_PROVIDER:-openai_chatgpt}
      LLM_MODEL: ${LLM_MODEL:-gpt-5.6-luna}
      LLM_API_KEY: ${LLM_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_WORKSPACE_ID: ${ANTHROPIC_WORKSPACE_ID:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-90}
      LLM_MAX_OUTPUT_TOKENS: ${LLM_MAX_OUTPUT_TOKENS:-2000}
      LLM_MAX_RETRIES: ${LLM_MAX_RETRIES:-2}
      AI_TRACE_LEVEL: ${AI_TRACE_LEVEL:-NORMAL}

      CORE_BASE_URL: http://backend:8080
      AI_ENGINE_PUBLIC_BASE_URL: ${AI_ENGINE_PUBLIC_BASE_URL:-http://127.0.0.1:18081}
      CORE_CALLBACK_TIMEOUT_SECONDS: ${CORE_CALLBACK_TIMEOUT_SECONDS:-5}
      CORE_CALLBACK_MAX_ATTEMPTS: ${CORE_CALLBACK_MAX_ATTEMPTS:-5}
      CORE_CALLBACK_INITIAL_DELAY_MS: ${CORE_CALLBACK_INITIAL_DELAY_MS:-100}
      CORE_CALLBACK_MAX_DELAY_MS: ${CORE_CALLBACK_MAX_DELAY_MS:-1000}
      AI_ENGINE_CORS_ORIGINS: ${AI_ENGINE_CORS_ORIGINS:-http://127.0.0.1:18083,http://localhost:18083,http://127.0.0.1:4200,http://localhost:4200}
      DEVLOG_SERVICE_AUTH_SECRET: ${DEVLOG_SERVICE_AUTH_SECRET:-}
      DEVLOG_BINDING_STORE_PATH: ${DEVLOG_BINDING_STORE_PATH:-/data/ai-bindings.sqlite3}
      DEVLOG_CREDENTIAL_STORE_PATH: ${DEVLOG_CREDENTIAL_STORE_PATH:-/data/ai-credentials.sqlite3}
      DEVLOG_CREDENTIAL_ENCRYPTION_KEY: ${DEVLOG_CREDENTIAL_ENCRYPTION_KEY:-}
      CHATGPT_OAUTH_ENABLED: ${CHATGPT_OAUTH_ENABLED:-true}
      CHATGPT_AGENT_NAME: ${CHATGPT_AGENT_NAME:-DevLog AI}
      CHATGPT_EXT_AGENT_HOST_ID: ${CHATGPT_EXT_AGENT_HOST_ID:-}
      CHATGPT_AUTHORIZATION_ENDPOINT: ${CHATGPT_AUTHORIZATION_ENDPOINT:-https://auth.openai.com/api/accounts/authorize}
      CHATGPT_TOKEN_ENDPOINT: ${CHATGPT_TOKEN_ENDPOINT:-https://auth.openai.com/api/accounts/oauth/token}
      CHATGPT_RESPONSES_ENDPOINT: ${CHATGPT_RESPONSES_ENDPOINT:-https://api.openai.com/v1/responses}
      CHATGPT_REDIRECT_URI: ${CHATGPT_REDIRECT_URI:-http://127.0.0.1:18081/api/v1/auth/chatgpt/callback}
      CHATGPT_FRONTEND_REDIRECT_URI: ${CHATGPT_FRONTEND_REDIRECT_URI:-http://127.0.0.1:18083/settings/ai}
      CHATGPT_SCOPES: ${CHATGPT_SCOPES:-openid profile email offline_access resource.invoke chatgpt.tokens.use.direct}
      CHATGPT_RESOURCE: ${CHATGPT_RESOURCE:-https://api.openai.com/v1}
      CHATGPT_ISSUER: ${CHATGPT_ISSUER:-https://auth.openai.com}
      CHATGPT_JWKS_URL: ${CHATGPT_JWKS_URL:-https://auth.openai.com/.well-known/jwks.json}
      CHATGPT_OAUTH_STORE_PATH: ${CHATGPT_OAUTH_STORE_PATH:-/data/ai-oauth.sqlite3}
      CHATGPT_OAUTH_TRANSACTION_TTL_SECONDS: ${CHATGPT_OAUTH_TRANSACTION_TTL_SECONDS:-300}

      LOG_LEVEL: ${AI_ENGINE_LOG_LEVEL:-INFO}

    ports:
      - "${AI_ENGINE_PORT:-18081}:8000"

    volumes:
      - devlog-ai-bindings:/data

    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://localhost:8000/health', timeout=2)
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  postgres:
    image: postgres:17
    container_name: devlog-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB:-devlog_ai}
      POSTGRES_USER: ${POSTGRES_USER:-devlog}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-devlog}

    ports:
      - "${POSTGRES_PORT:-18082}:5432"

    volumes:
      - devlog-postgres-data:/var/lib/postgresql/data

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    container_name: devlog-keycloak
    command: start-dev --import-realm
    restart: unless-stopped
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USERNAME:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_HOSTNAME: ${KEYCLOAK_HOSTNAME:-http://host.docker.internal:18084}
    ports:
      - "${KEYCLOAK_PORT:-18084}:8080"
    volumes:
      - ./docker/keycloak:/opt/keycloak/data/import:ro
    healthcheck:
      test:
        - CMD-SHELL
        - bash -c 'echo > /dev/tcp/127.0.0.1/8080'
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s

volumes:
  devlog-postgres-data:
  devlog-workspaces:
  devlog-ai-bindings:
