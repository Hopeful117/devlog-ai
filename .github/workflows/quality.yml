name: Quality Gate

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

jobs:
  quality:
    name: Build & Quality Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for SonarQube blame data

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Run tests with JaCoCo coverage
        working-directory: backend
        run: mvn clean verify -B -Dmaven.test.failure.ignore=true

      - name: Display coverage summary
        if: always()
        working-directory: backend
        run: |
          echo "=== JaCoCo Coverage Summary ==="
          python3 -c "
          import xml.etree.ElementTree as ET, os
          path = 'target/site/jacoco/jacoco.xml'
          if not os.path.exists(path):
              print('❌ No JaCoCo report found'); exit(1)
          tree = ET.parse(path)
          for c in tree.getroot().findall('counter'):
              t = c.get('type')
              m, cv = int(c.get('missed')), int(c.get('covered'))
              r = cv / (m + cv) if (m + cv) > 0 else 0
              s = '✅' if r >= 0.80 or t != 'LINE' else '❌'
              print(f'  {s} {t}: {cv}/{m+cv} ({r:.1%})')
          "

      - name: Upload JaCoCo report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: backend/target/site/jacoco/
          retention-days: 30

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: backend/target/surefire-reports/
          retention-days: 30
