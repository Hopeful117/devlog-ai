<header class="shell-header">
  <div class="shell-header__inner">
    <a class="wordmark" routerLink="/projects" aria-label="Developer OS home">
      <span class="wordmark__mark">D</span>
      <span><strong>Developer OS</strong><small>Project Workspace</small></span>
    </a>
    <nav aria-label="Primary navigation">
      @for (application of applications; track application.id) {
        @if (application.id === 'DEVLOG') {
          <a routerLink="/projects" routerLinkActive="active">{{ application.label }}</a>
        } @else {
          <a [href]="application.destination">{{ application.label }}</a>
        }
      }
      <a class="nav-placeholder" aria-disabled="true" title="Coming soon">Notifications</a>
      <a class="nav-placeholder" aria-disabled="true" title="Coming soon">Settings</a>
    </nav>
  </div>
</header>
<main><router-outlet /></main>
<footer><span>Developer OS</span><span>Project intelligence, under human control</span></footer>
