spring.application.name=devlog-ai-backend
server.port=${SERVER_PORT:18080}
logging.level.root=${LOG_LEVEL_ROOT:INFO}
logging.level.com.hopeful117.devlogai=${LOG_LEVEL_APP:INFO}
logging.pattern.console=%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} level=%-5level service=${spring.application.name} correlationId=%X{correlationId:-none} logger=%logger{36} message=%msg%n%wEx
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:18082/devlog_ai}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.datasource.username=${DB_USERNAME:devlog}
spring.datasource.password=${DB_PASSWORD:devlog}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha

collection.workspace-root=${COLLECTION_WORKSPACE_ROOT:./data/workspaces}

devlog.collection.max-files=${COLLECTION_MAX_FILES:10000}
devlog.collection.max-file-size=${COLLECTION_MAX_FILE_SIZE:1048576}
devlog.collection.max-total-bytes=${COLLECTION_MAX_TOTAL_BYTES:20971520}
devlog.collection.max-facts-per-type=${COLLECTION_MAX_FACTS_PER_TYPE:500}
devlog.collection.collector-timeout=${COLLECTION_COLLECTOR_TIMEOUT:10s}
devlog.collection.excluded-directories=.git,target,build,node_modules,dist,out,coverage,.venv,venv
devlog.collection.collectors.repository-metadata.enabled=true
devlog.collection.collectors.build.enabled=true
devlog.collection.collectors.spring.enabled=true
devlog.collection.collectors.docker.enabled=true
devlog.collection.collectors.documentation.enabled=true
devlog.collection.collectors.test-structure.enabled=true

# ADR-035/ADR-036: bound future AI-facing commit-diff contexts.
devlog.history.context.max-files=${HISTORY_CONTEXT_MAX_FILES:200}
devlog.history.context.max-changed-lines=${HISTORY_CONTEXT_MAX_CHANGED_LINES:20000}

# ADR-037: deterministic, repository-first context selection limits.
devlog.repository-context.max-evidence-items=${REPOSITORY_CONTEXT_MAX_EVIDENCE_ITEMS:60}
devlog.repository-context.max-summary-characters=${REPOSITORY_CONTEXT_MAX_SUMMARY_CHARACTERS:500}
devlog.repository-context.max-history-items=${REPOSITORY_CONTEXT_MAX_HISTORY_ITEMS:20}
devlog.repository-context.max-tokens=${REPOSITORY_CONTEXT_MAX_TOKENS:6000}
devlog.repository-context.content.max-enriched-files=${REPOSITORY_CONTEXT_CONTENT_MAX_FILES:6}
devlog.repository-context.content.max-characters-per-file=${REPOSITORY_CONTEXT_CONTENT_MAX_CHARACTERS_PER_FILE:4000}
devlog.repository-context.content.max-total-characters=${REPOSITORY_CONTEXT_CONTENT_MAX_TOTAL_CHARACTERS:12000}
devlog.repository-context.symbols.max-inspected-files=${REPOSITORY_CONTEXT_SYMBOL_MAX_FILES:6}
devlog.repository-context.symbols.max-input-characters-per-file=${REPOSITORY_CONTEXT_SYMBOL_MAX_INPUT_CHARACTERS:200000}
devlog.repository-context.symbols.max-symbols-per-file=${REPOSITORY_CONTEXT_SYMBOL_MAX_SYMBOLS_PER_FILE:40}
devlog.repository-context.symbols.max-total-symbols=${REPOSITORY_CONTEXT_SYMBOL_MAX_TOTAL_SYMBOLS:120}
devlog.repository-context.symbols.max-component-characters=${REPOSITORY_CONTEXT_SYMBOL_MAX_COMPONENT_CHARACTERS:300}
devlog.repository-context.symbols.max-tokens=${REPOSITORY_CONTEXT_SYMBOL_MAX_TOKENS:1500}
devlog.repository-context.symbols.max-parse-duration-per-file=${REPOSITORY_CONTEXT_SYMBOL_MAX_PARSE_DURATION:500ms}
devlog.repository-context.symbols.max-total-duration=${REPOSITORY_CONTEXT_SYMBOL_MAX_TOTAL_DURATION:2s}
devlog.engineering-story.agent-context.max-bytes=${ENGINEERING_STORY_AGENT_CONTEXT_MAX_BYTES:32768}
devlog.engineering-story.agent-context.max-estimated-tokens=${ENGINEERING_STORY_AGENT_CONTEXT_MAX_ESTIMATED_TOKENS:8192}
devlog.engineering-story.agent-context.max-reasons-per-evidence=${ENGINEERING_STORY_AGENT_CONTEXT_MAX_REASONS:3}
devlog.engineering-story.agent-context.max-related-references-per-evidence=${ENGINEERING_STORY_AGENT_CONTEXT_MAX_RELATED_REFERENCES:3}

ai-engine.base-url=${AI_ENGINE_BASE_URL:http://localhost:18081}
ai-engine.connect-timeout=${AI_ENGINE_CONNECT_TIMEOUT:2s}
ai-engine.read-timeout=${AI_ENGINE_READ_TIMEOUT:5s}
